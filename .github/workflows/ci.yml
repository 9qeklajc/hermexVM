name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install nak
        env:
          NAK_VERSION: v0.20.6
          NAK_SHA256: b44b36c792fbc3fb73b7ba3bbc94beda2219826271aa8d5f130f569c3817c3b9
        run: |
          set -euo pipefail
          asset="nak-${NAK_VERSION}-linux-amd64"
          curl --fail --silent --show-error --location \
            "https://github.com/fiatjaf/nak/releases/download/${NAK_VERSION}/${asset}" \
            --output "$RUNNER_TEMP/nak"
          echo "${NAK_SHA256}  $RUNNER_TEMP/nak" | sha256sum --check
          install -D -m 0755 "$RUNNER_TEMP/nak" "$RUNNER_TEMP/bin/nak"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check

      - name: Run smoke test
        run: pnpm smoke
